name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      - name: Build
        run: mvn -B -e -DskipTests package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: SnakeGame
          path: target/Snake.jar