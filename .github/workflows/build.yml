name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-slim
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build
        working-directory: Snake
        run: |
          javac -encoding UTF-8 -cp "lib/*" Snake.java
          mkdir integrate
          cd integrate && for jar in ../lib/*.jar; do jar xf "$jar"; done && cd ..
          cp *.class integrate/
          jar -cfm Snake.jar MANIFEST.MF -C integrate .

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: SnakeGame
          path: Snake/Snake.jar